name: CI

# CI workflow for Solar AC Controller
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy

      - name: Lint with Ruff
        run: ruff check custom_components/solar_ac_controller

      - name: Format check with Black
        run: black --check custom_components/solar_ac_controller

      - name: Type check with mypy
        run: mypy custom_components/solar_ac_controller

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ha-version: ["2024.12.0", "2025.1.0"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant==${{ matrix.ha-version }} pytest pytest-asyncio

      - name: Run tests
        run: pytest

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  release-drafter:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Update Release Draft
        uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
