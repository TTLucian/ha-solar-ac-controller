name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Weekly dependency drift check (see .github/scripts/check_dependency_freshness.py)
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

# Cancel superseded runs on the same ref to avoid wasting runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Never let a tool silently re-resolve dependencies: the lockfile is the
  # single source of truth for what CI tests against.
  UV_FROZEN: "1"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version-file: ".python-version"

      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff - integration
        run: uv run --frozen ruff check custom_components/solar_ac_controller

      - name: Ruff - tests
        run: uv run --frozen ruff check tests/

      - name: Mypy - integration
        run: uv run --frozen mypy --config-file mypy.ini custom_components/solar_ac_controller

      # tests/ is a namespace package, so it needs the package-bases flags.
      # --namespace-packages --explicit-package-bases keeps mypy from aborting
      # with "Source file found twice under different module names".
      - name: Mypy - tests
        run: >-
          uv run --frozen mypy --config-file mypy.ini
          --namespace-packages --explicit-package-bases tests/

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --locked

      - name: Report resolved versions
        run: |
          uv run --frozen python --version
          uv run --frozen python -c "from homeassistant.const import __version__ as v; print('homeassistant', v)"
          uv run --frozen pytest --version

      - name: Run tests
        run: uv run --frozen pytest -q --junitxml=junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: junit.xml
          retention-days: 7

  dependencies:
    name: Dependency freshness
    # Only meaningful on the weekly schedule / manual dispatch: on pushes and
    # PRs the lockfile is authoritative and this would only add noise.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version-file: ".python-version"

      - name: Report newer stable releases
        # Exits non-zero when a newer stable Home Assistant is available, so
        # the drift shows up as a red job instead of going unnoticed.
        # `packaging` is supplied as an ephemeral overlay so the script does
        # not need to become a declared dependency of the project.
        run: uv run --frozen --with packaging python .github/scripts/check_dependency_freshness.py

      - name: Summary
        if: always()
        run: echo "See the job log for Home Assistant / harness version drift."