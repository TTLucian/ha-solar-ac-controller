name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  python-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Get required Python version from latest homeassistant on PyPI
        id: get-version
        run: |
          REQUIRES=$(curl -s https://pypi.org/pypi/homeassistant/json | jq -r '.info.requires_python')
          VERSION=$(echo "$REQUIRES" | grep -oP '\d+\.\d+' | head -1)
          echo "Detected Python requirement: $REQUIRES -> $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  lint:
    needs: python-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.python-version.outputs.version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant ruff black mypy

      - name: Lint with Ruff
        run: ruff check custom_components/solar_ac_controller

      - name: Format check with Black
        run: black --check custom_components/solar_ac_controller

      - name: Type check with mypy
        run: mypy --config-file mypy.ini custom_components/solar_ac_controller

  test:
    needs: python-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.python-version.outputs.version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio \
            pytest-homeassistant-custom-component \
            homeassistant

      - name: Run tests
        run: pytest

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  release-drafter:
    runs-on: ubuntu-latest
    if: "github.event_name == 'push' && github.ref == 'refs/heads/main'"
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from manifest.json
        id: manifest
        run: |
          VERSION=$(jq -r '.version' custom_components/solar_ac_controller/manifest.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update Release Draft
        uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
          version: ${{ steps.manifest.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}